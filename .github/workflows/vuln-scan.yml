name: Vulnerability Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, since new CVEs get published against unchanged code.
    - cron: '0 6 * * 1'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scan (report-only)
        run: node bin/scan.mjs . --json vuln-report.json
        # This repo IS vuln-scan, and it's already checked out above — so
        # this dogfoods the tool against itself, no install/publish step
        # needed. If you copy this workflow into a *different* repo that
        # wants to use vuln-scan, check this repo out as a sibling and
        # point at its bin/scan.mjs instead, e.g.:
        #   - uses: actions/checkout@v4
        #     with: { repository: null6174k/vuln-scan, path: vuln-scan }
        #   - run: node vuln-scan/bin/scan.mjs . --json vuln-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vuln-report
          path: vuln-report.json
